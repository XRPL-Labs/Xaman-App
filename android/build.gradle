// Top-level build file where you can add configuration options common to all sub-projects/modules.
import groovy.json.JsonSlurper

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        kotlinVersion = "1.9.24"
        RNNKotlinVersion = ext.kotlinVersion
        detoxKotlinVersion = ext.kotlinVersion
        ndkVersion = "28.0.13004108"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // classpath("com.android.tools.build:gradle:7.3.1")
        // CameraX 1.5.2 AARs require AGP 8.6.0+
        classpath("com.android.tools.build:gradle:8.6.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // Firebase
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.1'
        classpath 'com.google.gms:google-services:4.3.13'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files

        // classpath 'com.google.android.gms:strict-version-matcher-plugin:1.2.1'
    }
}

allprojects {
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.2'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.5.2'  // THIS IS THE MISSING PIECE
            
            // Also force the BOM to match
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-bom:1.5.2'

            // vision-camera 4.6.4 pins CameraX 1.5.0-alpha03, which crashes on Android 17
            // when enumerating cameras (unknown dynamic-range profile). 1.5.2 is the
            // cherry-pick of that fix on the 1.5 line; 1.6.0 switches to CameraPipe.
            force 'androidx.camera:camera-core:1.5.2'
            force 'androidx.camera:camera-camera2:1.5.2'
            force 'androidx.camera:camera-lifecycle:1.5.2'
            force 'androidx.camera:camera-video:1.5.2'
            force 'androidx.camera:camera-view:1.5.2'
            force 'androidx.camera:camera-extensions:1.5.2'
        }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:deprecation"
        }
    }
    repositories {
        maven {
            // All of Detox' artifacts are provided via the npm module
            url "$rootDir/../node_modules/detox/Detox-android"
        }
        // Uncomment this to use local AAR files
        flatDir {
            dirs "$projectDir/app/libs"
        }

        google()
        maven { url 'https://jitpack.io' }
        maven { url "https://cdn.veriff.me/android/" } // veriff
    }
}

apply plugin: "com.facebook.react.rootproject"